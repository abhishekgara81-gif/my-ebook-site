<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn HTML in 7 Days - Premium E-Book</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hero { text-align: center; margin-bottom: 30px; animation: fadeIn 1s ease-in-out; }
        .hero h1 { font-size: 2.8rem; color: #00d2ff; font-weight: 700; text-shadow: 0 2px 10px rgba(0,210,255,0.3); margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; color: #e0e0e0; max-width: 600px; margin: 0 auto; }
        .main-container { display: flex; flex-wrap: wrap; max-width: 950px; width: 100%; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; }
        .book-preview { flex: 1; min-width: 300px; background: rgba(0, 0, 0, 0.2); padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .book-cover { width: 180px; height: 260px; background: linear-gradient(45deg, #00c6ff, #0072ff); border-radius: 10px; box-shadow: 0 15px 35px rgba(0,114,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 20px; border-left: 5px solid #0052d4; transition: transform 0.3s; }
        .book-cover:hover { transform: scale(1.05) rotate(2deg); }
        .form-section { flex: 1; min-width: 300px; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        h2 { font-size: 1.8rem; color: #fff; margin-bottom: 20px; font-weight: 600; text-align: center; }
        input { width: 100%; padding: 14px; margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        input::placeholder { color: #ccc; }
        input:focus { border-color: #00d2ff; background: rgba(255,255,255,0.15); outline: none; box-shadow: 0 0 10px rgba(0,210,255,0.2); }
        button { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: white; border: none; padding: 14px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(255,65,108,0.4); transition: 0.3s; }
        button:hover { background: linear-gradient(90deg, #ff4b2b, #ff416c); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,65,108,0.6); }
        .database-box { width: 100%; max-width: 950px; margin-top: 35px; background: rgba(0, 0, 0, 0.4); padding: 25px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .database-box h3 { font-size: 1.3rem; margin-bottom: 15px; color: #00d2ff; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid rgba(255,255,255,0.1); padding: 12px; text-align: left; font-size: 15px; }
        th { background-color: rgba(0, 210, 255, 0.15); color: #00d2ff; font-weight: 600; }
        td { color: #e0e0e0; background: rgba(255,255,255,0.02); }
        tr:hover td { background: rgba(255,255,255,0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="hero">
        <h1>"Learn HTML in 7 Days"</h1>
        <p>बिना किसी कोडिंग बैकग्राउंड के वेब लेआउट के मास्टर बनें। आज ही अपनी फ्री कॉपी डाउनलोड करें!</p>
    </div>

    <div class="main-container">
        <!-- बुक कवर विजुअल -->
        <div class="book-preview">
            <div class="book-cover">📚</div>
            <h3>Premium Edition</h3>
            <p style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">HTML5 & Modern Layouts Included</p>
        </div>

        <!-- डाउनलोड फॉर्म सेक्शन -->
        <div class="form-section">
            <h2>Download Your Free Copy Now</h2>
            <form id="subForm">
                <input type="text" id="userName" placeholder="आपका नाम (Your Name)" required>
                <input type="email" id="userEmail" placeholder="आपकी ईमेल आईडी (Your Email)" required>
                <button type="submit">Download E-Book 🚀</button>
            </form>
        </div>
    </div>

    <!-- लाइव डेटाबेस डैशबोर्ड -->
    <div class="database-box">
        <h3>🖥️ Live SQLite/Local Database Logs</h3>
        <table>
            <thead>
                <tr>
                    <th>नाम (Name)</th>
                    <th>ईमेल (Email)</th>
                </tr>
            </thead>
            <tbody id="dbRows">
                <!-- डेटा यहाँ लाइव दिखेगा -->
            </tbody>
        </table>
    </div>

    <script>
        function loadDatabase() {
            const dbRows = document.getElementById('dbRows');
            dbRows.innerHTML = '';
            const subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
            subscribers.forEach(user => {
                dbRows.innerHTML += `<tr><td>${user.name}</td><td>${user.email}</td></tr>`;
            });
        }

        document.getElementById('subForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;

            const subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
            subscribers.push({ name, email });
            localStorage.setItem('subscribers', JSON.stringify(subscribers));

            alert(`बधाई हो ${name}! आपका डेटाबेस लॉग सफलतापूर्वक अपडेट हो गया है।`);
            window.open('book.pdf', '_blank');
            document.getElementById('subForm').reset();
            loadDatabase();
        });

        loadDatabase();
    </script>
</body>
</html>
