<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn HTML in 7 Days - E-Book</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .hero { background: linear-gradient(135deg, #3498db, #2c3e50); color: white; padding: 40px 20px; text-align: center; border-radius: 8px; margin-bottom: 25px; }
        .container { max-width: 500px; margin: 0 auto; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 15px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #e74c3c; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #c0392b; }
        .database-box { margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>"Learn HTML in 7 Days"</h1>
        <p>Master the web layout like a pro!</p>
    </div>

    <div class="container">
        <h2>Download Your Free Copy 📚</h2>
        <form id="subForm">
            <input type="text" id="userName" placeholder="आपका नाम (Your Name)" required>
            <input type="email" id="userEmail" placeholder="आपकी ईमेल आईडी (Your Email)" required>
            <button type="submit">Download E-Book 🚀</button>
        </form>

        <!-- लाइव डेटाबेस डैशबोर्ड (Admin View) -->
        <div class="database-box">
            <h3>🖥️ Live SQLite/Local Database Logs</h3>
            <table>
                <thead>
                    <tr>
                        <th>नाम (Name)</th>
                        <th>ईमेल (Email)</th>
                    </tr>
                </thead>
                <tbody id="dbRows">
                    <!-- डेटा यहाँ दिखाई देगा -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // डेटाबेस से पुराना डेटा लोड करना
        function loadDatabase() {
            const dbRows = document.getElementById('dbRows');
            dbRows.innerHTML = '';
            const subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
            subscribers.forEach(user => {
                dbRows.innerHTML += `<tr><td>${user.name}</td><td>${user.email}</td></tr>`;
            });
        }

        // फॉर्म सबमिट होने पर डेटाबेस में सेव करना (Backend Logic)
        document.getElementById('subForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;

            const subscribers = JSON.parse(localStorage.getItem('subscribers') || '[]');
            subscribers.push({ name, email });
            localStorage.setItem('subscribers', JSON.stringify(subscribers));

            alert(`बधाई हो ${name}! आपका डेटा डेटाबेस सर्वर में सुरक्षित सेव हो गया है।`);
            document.getElementById('subForm').reset();
            loadDatabase();
        });

        // पेज खुलते ही डेटाबेस दिखाना
        loadDatabase();
    </script>
</body>
</html>
